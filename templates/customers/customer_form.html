{% extends 'base.html' %}

{% block title %}{{ action }} Customer - Savyant Systems{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header">
        <h1 class="card-title">{{ action }} Customer</h1>
        <a href="{% url 'customer_list' %}" class="btn btn-secondary btn-sm">&larr; Back to Customers</a>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="name">Customer Full Name *</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ customer.name|default:'' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ customer.email|default:'' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="mobile">Mobile Number *</label>
            <input type="text" id="mobile" name="mobile" class="form-control" value="{{ customer.mobile|default:'' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="city">City / Region *</label>
            <input type="text" id="city" name="city" class="form-control" value="{{ customer.city|default:'' }}" required>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
            <input type="checkbox" id="is_active" name="is_active" {% if customer.is_active or not customer %}checked{% endif %} style="width: 1.15rem; height: 1.15rem;">
            <label for="is_active" style="font-weight: 500; font-size: 0.9rem;">Customer is Active (available for new orders)</label>
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            <button type="submit" class="btn btn-primary">Save Customer</button>
            <a href="{% url 'customer_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
